
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint | ResolveHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
            padding: 35px 16px;
        }

        .container {
            max-width: 760px;
            margin: auto;
        }

        .back-link {
            display: inline-block;
            color: #2563eb;
            text-decoration: none;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.04);
        }

        .eyebrow {
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            background: white;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .hint {
            color: #64748b;
            font-size: 12px;
            margin-top: 7px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
        }

        .primary {
            background: #2563eb;
            color: white;
            border: none;
            flex: 1;
        }

        .secondary {
            background: white;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        @media (max-width: 520px) {
            .card {
                padding: 22px;
            }

            .actions {
                flex-direction: column;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <a class="back-link" href="/">← Back to Dashboard</a>

        <section class="card">
            <p class="eyebrow">RESOLVEHUB SUPPORT</p>

            <h1>Submit a Complaint</h1>

            <p class="subtitle">
                Tell us about the issue you are facing.
                Provide the details below so it can be reviewed.
            </p>

            <form action="/submit" method="POST">

                <div class="form-group">
                    <label for="title">Complaint Title *</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Wi-Fi not working"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="IT Support">IT Support</option>
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Academics">Academics</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority *</label>
                    <select id="priority" name="priority" required>
                        <option value="">Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Complaint Description *</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Explain the problem in detail..."
                        maxlength="2000"
                        required
                    ></textarea>
                    <p class="hint">
                        Do not include passwords or other sensitive information.
                    </p>
                </div>

                <div class="actions">
                    <a class="btn secondary" href="/">Cancel</a>
                    <button class="btn primary" type="submit">
                        Submit Complaint →
                    </button>
                </div>

            </form>
        </section>
    </main>
</body>
</html>
